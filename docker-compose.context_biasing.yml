services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.context_biasing
    environment:
      - ASR_CONTEXT_BIASING_MODE=${ASR_CONTEXT_BIASING_MODE:-disabled}
      - ASR_CONTEXT_BIASING_METHOD=${ASR_CONTEXT_BIASING_METHOD:-ctc_ws}
      - ASR_CONTEXT_BIASING_NEMO_SOURCE=${ASR_CONTEXT_BIASING_NEMO_SOURCE:-}
      - ASR_CONTEXT_BIASING_NEMO_MODEL_CLASS=${ASR_CONTEXT_BIASING_NEMO_MODEL_CLASS:-}
      - ASR_CONTEXT_BIASING_PHRASES_DIR=${ASR_CONTEXT_BIASING_PHRASES_DIR:-/srv/context_biasing/phrases}
      - ASR_CONTEXT_BIASING_TIMEOUT_MS=${ASR_CONTEXT_BIASING_TIMEOUT_MS:-4000}
      - ASR_CONTEXT_BIASING_MAX_CONCURRENT_INFERENCES=${ASR_CONTEXT_BIASING_MAX_CONCURRENT_INFERENCES:-1}
      - ASR_CONTEXT_BIASING_EXECUTOR_WORKERS=${ASR_CONTEXT_BIASING_EXECUTOR_WORKERS:-}
      - ASR_CONTEXT_BIASING_QUEUE_TIMEOUT_MS=${ASR_CONTEXT_BIASING_QUEUE_TIMEOUT_MS:-}
      - ASR_CONTEXT_BIASING_MODEL_POOL_SIZE=${ASR_CONTEXT_BIASING_MODEL_POOL_SIZE:-1}
      - ASR_CONTEXT_BIASING_MODEL_POOL_LOAD_MODE=${ASR_CONTEXT_BIASING_MODEL_POOL_LOAD_MODE:-eager}
      - ASR_CONTEXT_BIASING_DEVICE=${ASR_CONTEXT_BIASING_DEVICE:-cuda}
      - ASR_CONTEXT_BIASING_SHADOW_SAMPLE_RATE=${ASR_CONTEXT_BIASING_SHADOW_SAMPLE_RATE:-1.0}
      - ASR_CONTEXT_BIASING_BEAM_THRESHOLD=${ASR_CONTEXT_BIASING_BEAM_THRESHOLD:-8.0}
      - ASR_CONTEXT_BIASING_CONTEXT_SCORE=${ASR_CONTEXT_BIASING_CONTEXT_SCORE:-3.0}
      - ASR_CONTEXT_BIASING_CTC_ALI_TOKEN_WEIGHT=${ASR_CONTEXT_BIASING_CTC_ALI_TOKEN_WEIGHT:-0.6}
      - ASR_CONTEXT_BIASING_DYNAMIC_MAX_PHRASES=${ASR_CONTEXT_BIASING_DYNAMIC_MAX_PHRASES:-32}
      - CUDA_LAUNCH_BLOCKING=${CUDA_LAUNCH_BLOCKING:-}
    volumes:
      - ./context_biasing:/srv/context_biasing:ro
      - /home/ubuntu/models:/home/ubuntu/models:ro
