worker_processes auto;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Re-resolve Docker service names so upstream IP changes do not cause stale routing.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Basic edge protection
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=10r/s;

  server {
    listen 80;

    set $gateway_host gateway:8000;

    limit_conn conn_per_ip 50;
    limit_req zone=req_per_ip burst=50 nodelay;

    location /ws/stt {
      proxy_pass http://$gateway_host/ws/stt;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://$gateway_host/;
      proxy_set_header Host $host;
    }

    location /healthz { proxy_pass http://$gateway_host/healthz; }
    location /metrics { proxy_pass http://$gateway_host/metrics; }
  }
}
