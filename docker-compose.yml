services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  prometheus:
    image: prom/prometheus:v2.53.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - worker
      - node-exporter

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'


  dcgm-exporter:
    image: nvidia/dcgm-exporter:4.5.2-4.8.1-distroless
    user: "0:0"
    cap_add:
      - SYS_ADMIN
    ports:
      - "9400:9400"
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      - ASR_MODEL_NAME=${ASR_MODEL_NAME}
      - ASR_DECODER=${ASR_DECODER}
      - ASR_INFERENCE_TIMEOUT_MS=${ASR_INFERENCE_TIMEOUT_MS}
      - ASR_DEFAULT_LANGUAGE=${ASR_DEFAULT_LANGUAGE}
      - ASR_SUPPORTED_LANGS=${ASR_SUPPORTED_LANGS}
      - ASR_ENABLE_LID=${ASR_ENABLE_LID}
      - ASR_LID_MODEL_SOURCE=${ASR_LID_MODEL_SOURCE}
      - ASR_LID_MODEL_DIR=${ASR_LID_MODEL_DIR}
      - ASR_LID_CACHE_TTL_SEC=${ASR_LID_CACHE_TTL_SEC}
      - ASR_LID_CACHE_MAX_ENTRIES=${ASR_LID_CACHE_MAX_ENTRIES}
      - ASR_CONTEXT_BIASING_MODE=${ASR_CONTEXT_BIASING_MODE:-disabled}
      - ASR_CONTEXT_BIASING_METHOD=${ASR_CONTEXT_BIASING_METHOD:-ctc_ws}
      - ASR_CONTEXT_BIASING_NEMO_SOURCE=${ASR_CONTEXT_BIASING_NEMO_SOURCE:-}
      - ASR_CONTEXT_BIASING_NEMO_MODEL_CLASS=${ASR_CONTEXT_BIASING_NEMO_MODEL_CLASS:-}
      - ASR_CONTEXT_BIASING_PHRASES_DIR=${ASR_CONTEXT_BIASING_PHRASES_DIR:-}
      - ASR_CONTEXT_BIASING_TIMEOUT_MS=${ASR_CONTEXT_BIASING_TIMEOUT_MS:-4000}
      - ASR_CONTEXT_BIASING_DEVICE=${ASR_CONTEXT_BIASING_DEVICE:-cuda}
      - ASR_CONTEXT_BIASING_SHADOW_SAMPLE_RATE=${ASR_CONTEXT_BIASING_SHADOW_SAMPLE_RATE:-1.0}
      - ASR_CONTEXT_BIASING_BEAM_THRESHOLD=${ASR_CONTEXT_BIASING_BEAM_THRESHOLD:-8.0}
      - ASR_CONTEXT_BIASING_CONTEXT_SCORE=${ASR_CONTEXT_BIASING_CONTEXT_SCORE:-3.0}
      - ASR_CONTEXT_BIASING_CTC_ALI_TOKEN_WEIGHT=${ASR_CONTEXT_BIASING_CTC_ALI_TOKEN_WEIGHT:-0.6}
      - WORKER_MAX_JOBS=${WORKER_MAX_JOBS}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=${HF_HOME}
      - LOG_LEVEL=${LOG_LEVEL}
      - EVAL_LOGS_ENABLED=${EVAL_LOGS_ENABLED}
      - EVAL_LOG_SAMPLE_RATE=${EVAL_LOG_SAMPLE_RATE}
      - EVAL_LOG_TEXT_PREVIEW_CHARS=${EVAL_LOG_TEXT_PREVIEW_CHARS}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:9000/healthz').read().decode('utf-8').strip() == 'ok' else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --ws-ping-interval
      - "${GATEWAY_WS_PING_INTERVAL:-120}"
      - --ws-ping-timeout
      - "${GATEWAY_WS_PING_TIMEOUT:-120}"
    environment:
      - REDIS_URL=${REDIS_URL}
      - GATEWAY_DISABLE_RATE_LIMITING=${GATEWAY_DISABLE_RATE_LIMITING:-false}
      - MAX_CONNS_PER_KEY=${MAX_CONNS_PER_KEY}
      - NEW_CONN_PER_MIN=${NEW_CONN_PER_MIN}
      - CONN_BURST=${CONN_BURST}
      - MAX_BYTES_PER_SEC=${MAX_BYTES_PER_SEC}
      - WS_DISABLE_AUDIO_RATE_LIMIT=${WS_DISABLE_AUDIO_RATE_LIMIT:-false}
      - GATEWAY_MAX_INFLIGHT_WORKER=${GATEWAY_MAX_INFLIGHT_WORKER}
      - WORKER_TIMEOUT_MS=${WORKER_TIMEOUT_MS}
      - WORKER_URL=${WORKER_URL}
      - PARTIAL_DECODE_INTERVAL_MS=${PARTIAL_DECODE_INTERVAL_MS}
      - CIRCUIT_BREAKER_FAILS=${CIRCUIT_BREAKER_FAILS}
      - CIRCUIT_BREAKER_RESET_MS=${CIRCUIT_BREAKER_RESET_MS}
      - LOG_LEVEL=${LOG_LEVEL}
      - EVAL_LOGS_ENABLED=${EVAL_LOGS_ENABLED}
      - EVAL_LOG_SAMPLE_RATE=${EVAL_LOG_SAMPLE_RATE}
      - EVAL_LOG_TEXT_PREVIEW_CHARS=${EVAL_LOG_TEXT_PREVIEW_CHARS}
    ports: ["8000:8000"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz').read().decode('utf-8').strip() == 'ok' else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      redis:
        condition: service_started
      worker:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DEBUG_LOGS: ${VITE_DEBUG_LOGS:-true}
    restart: unless-stopped
    ports: ["5173:5173"]
    depends_on:
      gateway:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: ["gateway", "frontend"]

volumes:
  redis_data:
