services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - worker
      - node-exporter

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

  # Optional DCGM Exporter for GPU metrics
  # dcgm-exporter:
  #   image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.2.0
  #   ports:
  #     - "9400:9400"
  #   environment:
  #     - DCGM_EXPORTER_LISTEN=:9400
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - ASR_MODEL_NAME=${ASR_MODEL_NAME}
      - ASR_DECODER=${ASR_DECODER}
      - ASR_INFERENCE_TIMEOUT_MS=${ASR_INFERENCE_TIMEOUT_MS}
      - ASR_DEFAULT_LANGUAGE=${ASR_DEFAULT_LANGUAGE}
      - ASR_SUPPORTED_LANGS=${ASR_SUPPORTED_LANGS}
      - ASR_ENABLE_LID=${ASR_ENABLE_LID}
      - ASR_LID_MODEL_SOURCE=${ASR_LID_MODEL_SOURCE}
      - ASR_LID_MODEL_DIR=${ASR_LID_MODEL_DIR}
      - ASR_LID_CACHE_TTL_SEC=${ASR_LID_CACHE_TTL_SEC}
      - ASR_LID_CACHE_MAX_ENTRIES=${ASR_LID_CACHE_MAX_ENTRIES}
      - WORKER_MAX_JOBS=${WORKER_MAX_JOBS}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=${HF_HOME}
      - LOG_LEVEL=${LOG_LEVEL}
      - EVAL_LOGS_ENABLED=${EVAL_LOGS_ENABLED}
      - EVAL_LOG_SAMPLE_RATE=${EVAL_LOG_SAMPLE_RATE}
      - EVAL_LOG_TEXT_PREVIEW_CHARS=${EVAL_LOG_TEXT_PREVIEW_CHARS}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports: ["9000:9000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - MAX_CONNS_PER_KEY=${MAX_CONNS_PER_KEY}
      - NEW_CONN_PER_MIN=${NEW_CONN_PER_MIN}
      - CONN_BURST=${CONN_BURST}
      - MAX_BYTES_PER_SEC=${MAX_BYTES_PER_SEC}
      - GATEWAY_MAX_INFLIGHT_WORKER=${GATEWAY_MAX_INFLIGHT_WORKER}
      - WORKER_TIMEOUT_MS=${WORKER_TIMEOUT_MS}
      - WORKER_URL=${WORKER_URL}
      - CIRCUIT_BREAKER_FAILS=${CIRCUIT_BREAKER_FAILS}
      - CIRCUIT_BREAKER_RESET_MS=${CIRCUIT_BREAKER_RESET_MS}
      - LOG_LEVEL=${LOG_LEVEL}
      - EVAL_LOGS_ENABLED=${EVAL_LOGS_ENABLED}
      - EVAL_LOG_SAMPLE_RATE=${EVAL_LOG_SAMPLE_RATE}
      - EVAL_LOG_TEXT_PREVIEW_CHARS=${EVAL_LOG_TEXT_PREVIEW_CHARS}
    ports: ["8000:8000"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on: ["redis", "worker"]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: ["gateway"]

volumes:
  redis_data:
