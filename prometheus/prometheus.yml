global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: "worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9000"]

  # Optional Triton metrics when the docker-compose.triton.yml overlay is active.
  - job_name: "triton"
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]

  - job_name: "node"
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]

  # Optional GPU metrics (only if dcgm-exporter enabled)
  - job_name: "gpu"
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm-exporter:9400"]
